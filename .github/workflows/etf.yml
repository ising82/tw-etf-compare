name: ETF 績效資料

on:
  push:                       # 網頁或程式改動時自動重新部署（資料檔由 workflow 自己 commit，不觸發）
    branches: [main]
    paths: ["docs/**", "etf/**", ".github/workflows/etf.yml", "!docs/data/**"]
  schedule:
    # GitHub 排程常延遲數小時，所以台股排兩次：第二次若資料已最新只是重算，不會出錯
    - cron: "10 7 * * 1-5"    # UTC 07:10 = 台灣 15:10（台股收盤後）
    - cron: "40 10 * * 1-6"   # UTC 10:40 = 台灣 18:40（週六這次為台股整段重抓）
    - cron: "30 22 * * 1-5"   # UTC 22:30 = 美東 17:30／18:30（美股收盤後；台灣週六早上那次為整段重抓）
  workflow_dispatch:
    inputs:
      full:
        description: "整段重抓所有歷史（第一次或資料異常時勾選）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-data
  cancel-in-progress: false

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      # 排程觸發時只更新該時段收盤的市場；手動或推送程式時兩個市場都更新。單一市場失敗不擋另一個與部署。
      - name: 台股：ETF 清單、價格與配息
        if: github.event.schedule != '30 22 * * 1-5'
        run: python3 -m etf build --market tw ${{ inputs.full && '--full' || '' }} || echo "::warning::台股資料更新失敗，沿用前次資料"

      - name: 美股：價格與配息
        if: github.event.schedule != '10 7 * * 1-5' && github.event.schedule != '40 10 * * 1-6'
        run: python3 -m etf build --market us ${{ inputs.full && '--full' || '' }} || echo "::warning::美股資料更新失敗，沿用前次資料"

      - name: 保存資料到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git commit -m "ETF 資料 $(TZ=Asia/Taipei date +%F)"; then
            git pull --rebase --autostash -X theirs && git push   # 衝突時以本次新資料為準
          else
            echo "資料沒有變更"
          fi

      # 以下需要先在 Settings → Pages → Source 選「GitHub Actions」；沒開啟時這裡會失敗，但資料已存進 repo
      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
